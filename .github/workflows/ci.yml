name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m unittest discover -s tests -v
      - name: Run demonstration
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python examples/demo.py
      - name: Check whitespace
        run: git diff --check
      - name: Build and smoke-test wheel
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.14'
        shell: bash
        run: |
          wheel_dir="$(mktemp -d)"
          smoke_dir="$(mktemp -d)"
          python -m pip wheel --no-deps --wheel-dir "$wheel_dir" .
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install "$wheel_dir"/*.whl
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/gitlite" init
          printf 'installed\n' > installed.txt
          "$smoke_dir/venv/bin/gitlite" add installed.txt
          "$smoke_dir/venv/bin/gitlite" commit -m "installed smoke"
          "$smoke_dir/venv/bin/gitlite" status
          "$smoke_dir/venv/bin/gitlite" log
          "$smoke_dir/venv/bin/gitlite" fsck
