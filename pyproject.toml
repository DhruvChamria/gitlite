[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gitlite-local"
dynamic = ["version"]
description = "A small, Git-inspired local snapshot CLI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []
keywords = ["version-control", "education", "cli", "snapshots"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]

[project.urls]
Repository = "https://github.com/DhruvChamria/gitlite"
Documentation = "https://github.com/DhruvChamria/gitlite#readme"
Demo = "https://dhruvchamria.github.io/gitlite/"
Issues = "https://github.com/DhruvChamria/gitlite/issues"

[project.scripts]
gitlite = "gitlite.cli:main"

[tool.setuptools]
packages = ["gitlite"]

[tool.setuptools.dynamic]
version = {attr = "gitlite.__version__"}
